server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: whistledrop-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:whistledrop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: WhistleDropGdgsrmConfidentialPlatformSecretKey2026SecureKeyMustBeLongEnough
  expiration-ms: 86400000 # 24 hours

whistledrop:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://whistledrop-teal.vercel.app}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.whistledrop: INFO
    org.springframework.security: WARN
